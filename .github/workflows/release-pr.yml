name: Release PR

# Manually triggered from Actions -> Release PR -> Run workflow. Batches
# .changes/unreleased/ fragments into a new version, regenerates
# CHANGELOG.md, bumps package.json, src-tauri/tauri.conf.json and
# src-tauri/Cargo.toml (via changie's replacements:), refreshes
# src-tauri/Cargo.lock, and opens a release/vX.Y.Z PR for the owner to review
# and merge. See docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release (e.g. "v1.2.3" or "minor"/"major"/"patch"). Leave
          empty to let changie pick automatically from the fragments' kinds
          ("auto"). "1.2.3" without the leading v is accepted too.
        required: false
        default: ""

permissions:
  # The GitHub App token below does the actual writes (opening the PR); the
  # workflow's own GITHUB_TOKEN only needs to read the repo.
  contents: read

jobs:
  release-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    # workflow_dispatch can be run from any branch in the Actions UI; without
    # this guard a feature branch would be batched into a release PR.
    if: github.ref == 'refs/heads/main'
    steps:
      # A PR opened with the default GITHUB_TOKEN triggers no workflows
      # (GitHub's anti-recursion rule), so CI would never run on the release
      # PR. A GitHub App installation token doesn't have that restriction. See
      # docs/releasing.md for the one-time App setup.
      - name: Generate a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install changie
        run: go install github.com/miniscruff/changie@v1.26.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Fail clearly if there's nothing to release
        run: |
          set -euo pipefail
          if [ -z "$(ls -A .changes/unreleased/*.yaml 2>/dev/null)" ]; then
            echo "::error::.changes/unreleased/ has no fragments - nothing to release. Every PR since the last release should have added one (see docs/releasing.md)."
            exit 1
          fi

      - name: Batch and merge
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION_INPUT:-auto}"
          # changie keeps the version string as given: "1.2.3" would write
          # .changes/1.2.3.md, which the v*-globbing checks and the release/v*
          # branch exemption both miss. Normalise a leading digit to "v1.2.3";
          # auto/major/minor/patch and "v1.2.3" pass through.
          case "$version" in
            [0-9]*) version="v$version" ;;
          esac
          changie batch "$version"
          changie merge
          echo "RELEASE_VERSION=$(changie latest)" >>"$GITHUB_ENV"

      # changie's replacements: bumped Cargo.toml; Cargo.lock's own entry for
      # this crate has to follow. Only that one package is touched (-p), and
      # this needs the network (the registry index), so no --offline.
      - name: Refresh Cargo.lock
        run: cargo update --manifest-path src-tauri/Cargo.toml -p budgebell

      - name: Sanity-check all versions now agree
        run: bash scripts/release/check-version-consistency.sh

      - name: Write the PR body from the new version's release notes
        run: |
          set -euo pipefail
          # Drop the version file's own header line ("## vX.Y.Z - date"); the
          # PR title already says the version.
          tail -n +2 ".changes/${RELEASE_VERSION}.md" >"$RUNNER_TEMP/release-notes.md"

      - name: Open the release PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: release/${{ env.RELEASE_VERSION }}
          delete-branch: true
          title: "chore(release): ${{ env.RELEASE_VERSION }}"
          commit-message: "chore(release): ${{ env.RELEASE_VERSION }}"
          add-paths: |
            .changes/
            CHANGELOG.md
            package.json
            src-tauri/tauri.conf.json
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock
          body-path: ${{ runner.temp }}/release-notes.md
