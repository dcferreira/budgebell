kind: added
body: 'Nudges now wait while a full-screen app (a game, a video, a presentation) is in front, then show once you leave it. A new Settings toggle, on by default, controls it. On Linux this sees X11 and XWayland windows, Steam/Proton games included, but not native Wayland windows.'
