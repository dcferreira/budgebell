[package]
name = "habits"
version = "0.1.0"
description = "A fully-local desktop habits app"
authors = ["Daniel Ferreira"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "habits_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
thiserror = "2.0.19"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
rmcp = { version = "2.2.0", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"

[dev-dependencies]
# The MCP end-to-end tests drive the server through a real rmcp client over an
# in-memory duplex transport — a genuinely local transport, no network.
rmcp = { version = "2.2.0", features = ["client"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread"] }
