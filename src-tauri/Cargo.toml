[package]
name = "budgebell"
version = "0.1.0"
description = "Budgebell — a fully-local desktop habits app"
authors = ["Daniel Ferreira"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "budgebell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
thiserror = "2.0.19"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
rmcp = { version = "2.2.0", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
# Resolves the platform data directory for the headless MCP server's DB path,
# matching Tauri's `app_data_dir()`. Already in the tree via Tauri.
dirs = "6"

[patch.crates-io]
# Tauri 2.11.5 pins tray-icon = "^0.24". The Linux/GTK backend passes the
# icon's full file path (with extension) as the StatusNotifierItem IconName
# instead of a bare icon-theme name (the directory is already communicated
# separately via IconThemePath), which is off-spec: most StatusNotifierItem
# watchers, including GNOME's appindicator extension, fail that icon-theme
# lookup silently — the indicator still registers on D-Bus as Active, it just
# never gets a usable icon name. Fixed upstream in tray-icon 0.25.0, but
# that's outside Tauri's "^0.24" requirement and can't be pulled in without
# also bumping Tauri. Vendored copy at ../vendor/tray-icon-0.24.2-patched
# carries the same one-line fix, kept at a version Tauri still accepts.
# Drop this patch once Tauri bumps its own tray-icon requirement to 0.25+.
tray-icon = { path = "../vendor/tray-icon-0.24.2-patched" }

[dev-dependencies]
# The MCP end-to-end tests drive the server through a real rmcp client — over an
# in-memory duplex transport for the unit tests, and over a real child-process
# transport (the built binary in headless stdio mode) for the integration test.
# All genuinely local; no network.
rmcp = { version = "2.2.0", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread"] }
tempfile = "3"
